        <h2>11. Suppression du Compte</h2>

        <p>Your data is first stored locally on your device (offline-first), then synced with Supabase, hosted on servers located in the European Union (France). Communications are encrypted (TLS), and access is restricted to the account owner through server-side security rules.</p>

        <h2>6. Recipients and Sharing</h2>
        <p>Your data is never sold. It may be processed by the following providers, only for the purposes described:</p>
        <ul>
          <li><strong>Supabase:</strong> hosting, authentication and synchronization.</li>
          <li><strong>Google AdMob:</strong> ad delivery and consent management.</li>
          <li><strong>Firebase Cloud Messaging and Crashlytics:</strong> push notifications and crash reports.</li>
          <li><strong>OpenWeather:</strong> weather forecasts based on the relevant apiary coordinates.</li>
        </ul>
        <p>Some providers may process data outside Morocco or the European Union. Such transfers are covered by the appropriate safeguards required by applicable law.</p>

        <h2>7. Advertising and Consent</h2>
        <p>The app is free and funded by advertising provided by Google AdMob. If you are in the European Economic Area, the United Kingdom or Switzerland, a Google consent prompt is shown before any personalized ad. You may accept, refuse or manage your choices.</p>
        <p>You can change or withdraw your consent at any time from: <strong>Settings → Ad privacy settings</strong>.</p>
        <p>If you refuse personalized ads, non-personalized ads may still be shown where permitted by law. If you refuse all advertising, some ad-funded features may no longer be available.</p>

        <h2>8. Retention Periods</h2>
        <ul>
          <li><strong>Account and beekeeping data:</strong> until you delete your account, then permanently deleted.</li>
          <li><strong>Backups:</strong> up to 30 days after deletion, while technical backups are purged.</li>
          <li><strong>Technical logs and crash reports:</strong> up to 90 days.</li>
          <li><strong>Advertising data:</strong> according to the periods set by Google.</li>
        </ul>

        <h2>9. Security</h2>
        <p>We implement reasonable technical and organizational measures: encrypted communications, access control, per-account data isolation and secure authentication. No system is perfectly secure, so please use a unique, strong password.</p>

        <h2>10. Your Rights</h2>
        <p>Depending on your law, you have the following rights:</p>
        <ul>
          <li><strong>Access:</strong> know what data is processed.</li>
          <li><strong>Rectification:</strong> correct inaccurate data.</li>
          <li><strong>Erasure:</strong> delete your account and data.</li>
          <li><strong>Restriction and objection:</strong> restrict or object to certain processing.</li>
          <li><strong>Portability:</strong> receive your data in a readable format.</li>
          <li><strong>Withdraw consent:</strong> at any time, especially for personalized advertising.</li>
        </ul>
        <p>To exercise these rights: <a href="mailto:awrghise@gmail.com">awrghise@gmail.com</a>. You may also lodge a complaint with the CNDP in Morocco or with the data protection authority in your country of residence.</p>

        <h2>11. Account Deletion</h2>
        <p>You can permanently delete your account and data from the app: <strong>Settings → Account → Delete account</strong>, or by contacting us at <a href="mailto:awrghise@gmail.com">awrghise@gmail.com</a>. Deletion erases your beekeeping data and profile, subject to legal retention obligations and the backup purge period.</p>

        <h2>12. Children</h2>
        <p>The app is not intended for children under 13 (or under 16 in the European Economic Area). We do not knowingly collect data about children. If you believe a child provided us with data, contact us to delete it.</p>

        <h2>13. Changes to this Policy</h2>
        <p>We may update this policy to reflect legal or technical changes. The new version is published on this page with a new effective date. For significant changes, a notice may be shown in the app.</p>

        <h2>14. Contact</h2>
        <p>For any question, complaint or request regarding your data:<br>Email: <a href="mailto:awrghise@gmail.com">awrghise@gmail.com</a><br>Controller: Hivelogbee developer, Morocco.</p>
      `,

      es: `
        <h1>Política de Privacidad de Hivelogbee</h1>
        <p class="effective-date"><strong>Fecha de entrada en vigor:</strong> 26 de octubre de 2026 — Versión 1.0</p>

        <h2>1. Responsable del Tratamiento</h2>
        <p>Hivelogbee es desarrollada y gestionada por un desarrollador con sede en Marruecos.<br>Para cualquier consulta sobre sus datos: <a href="mailto:awrghise@gmail.com">awrghise@gmail.com</a></p>

        <h2>2. Ley Aplicable</h2>
        <p>El tratamiento se rige por la ley marroquí (Ley n.º 09-08 relativa a la protección de las personas físicas en lo que respecta al tratamiento de datos personales).</p>
        <p>Si reside en el Espacio Económico Europeo, el Reino Unido o Suiza, también se aplican el RGPD, el UK GDPR o la LPD suiza, sin perjuicio de los derechos que le otorgue su legislación local.</p>

        <h2>3. Datos Recopilados</h2>
        <ul>
          <li><strong>Datos de cuenta:</strong> correo electrónico, identificador, idioma y preferencias.</li>
          <li><strong>Datos apícolas:</strong> apiarios, colmenas, inspecciones, tratamientos, producciones, recordatorios y notas que introduce.</li>
          <li><strong>Ubicación:</strong> solo al crear o editar un apiario, para el pronóstico del tiempo. No se rastrea en segundo plano ni se usa con fines publicitarios.</li>
          <li><strong>Notificaciones:</strong> token de notificación (FCM), zona horaria e idioma, para enviar los recordatorios y alertas activados.</li>
          <li><strong>Datos técnicos:</strong> modelo del dispositivo, versión del sistema, versión de la app e informes de fallos (Firebase Crashlytics), para corregir errores.</li>
          <li><strong>Publicidad:</strong> Google AdMob puede recopilar el identificador publicitario, la dirección IP aproximada y datos de interacción con anuncios. Los anuncios personalizados solo se muestran con su consentimiento cuando la ley lo exige.</li>
          <li><strong>Fotos y medios:</strong> la app no recopila, procesa ni almacena imágenes, vídeos ni archivos multimedia.</li>
        </ul>

        <h2>4. Finalidades y Bases Legales</h2>
        <ul>
          <li><strong>Prestación del servicio:</strong> guardar y sincronizar sus datos apícolas (ejecución del contrato).</li>
          <li><strong>Copia de seguridad y sincronización:</strong> conservar sus datos en nuestros servidores y restaurarlos en otro dispositivo (ejecución del contrato).</li>
          <li><strong>Notificaciones:</strong> recordatorios, alertas meteorológicas y mensajes activados (consentimiento o contrato).</li>
          <li><strong>Publicidad:</strong> mostrar anuncios (consentimiento para anuncios personalizados; interés legítimo para anuncios no personalizados cuando la ley lo permite).</li>
          <li><strong>Seguridad y mejora:</strong> prevenir abusos y mejorar la estabilidad de la app (interés legítimo).</li>
        </ul>

        <h2>5. Almacenamiento y Alojamiento</h2>
        <p>Sus datos se guardan primero localmente en su dispositivo (funcionamiento sin conexión) y luego se sincronizan con Supabase, alojado en servidores situados en la Unión Europea (Francia). Las comunicaciones están cifradas (TLS) y el acceso se limita al titular de la cuenta mediante reglas de seguridad del servidor.</p>

        <h2>6. Destinatarios y Cesión</h2>
        <p>Sus datos nunca se venden. Pueden ser tratados por los siguientes proveedores, únicamente para las finalidades descritas:</p>
        <ul>
          <li><strong>Supabase:</strong> alojamiento, autenticación y sincronización.</li>
          <li><strong>Google AdMob:</strong> difusión de anuncios y gestión del consentimiento.</li>
          <li><strong>Firebase Cloud Messaging y Crashlytics:</strong> notificaciones push e informes de fallos.</li>
          <li><strong>OpenWeather:</strong> pronósticos meteorológicos a partir de las coordenadas del apiario correspondiente.</li>
        </ul>
        <p>Algunos proveedores pueden tratar datos fuera de Marruecos o de la Unión Europea. Estas transferencias están amparadas por las garantías adecuadas exigidas por la ley aplicable.</p>

        <h2>7. Publicidad y Consentimiento</h2>
        <p>La app es gratuita y se financia con publicidad de Google AdMob. Si se encuentra en el Espacio Económico Europeo, el Reino Unido o Suiza, se muestra una ventana de consentimiento de Google antes de cualquier anuncio personalizado. Puede aceptar, rechazar o gestionar sus opciones.</p>
        <p>Puede cambiar o retirar su consentimiento en cualquier momento desde: <strong>Configuración → Privacidad de anuncios</strong>.</p>
        <p>Si rechaza los anuncios personalizados, aún podrán mostrarse anuncios no personalizados cuando la ley lo permita. Si rechaza toda publicidad, algunas funciones financiadas por anuncios pueden dejar de estar disponibles.</p>

        <h2>8. Plazos de Conservación</h2>
        <ul>
          <li><strong>Cuenta y datos apícolas:</strong> hasta que elimine su cuenta, después se borran definitivamente.</li>
          <li><strong>Copias de seguridad:</strong> hasta 30 días tras la eliminación, mientras se purgan las copias técnicas.</li>
          <li><strong>Registros técnicos e informes de fallos:</strong> hasta 90 días.</li>
          <li><strong>Datos publicitarios:</strong> según los plazos definidos por Google.</li>
        </ul>

        <h2>9. Seguridad</h2>
        <p>Aplicamos medidas técnicas y organizativas razonables: cifrado de comunicaciones, control de acceso, aislamiento de datos por cuenta y autenticación segura. Ningún sistema es perfectamente seguro, por lo que le recomendamos usar una contraseña única y robusta.</p>

        <h2>10. Sus Derechos</h2>
        <p>Según su legislación, dispone de los siguientes derechos:</p>
        <ul>
          <li><strong>Acceso:</strong> saber qué datos se tratan.</li>
          <li><strong>Rectificación:</strong> corregir datos inexactos.</li>
          <li><strong>Supresión:</strong> eliminar su cuenta y sus datos.</li>
          <li><strong>Limitación y oposición:</strong> limitar u oponerse a determinados tratamientos.</li>
          <li><strong>Portabilidad:</strong> recibir sus datos en un formato legible.</li>
          <li><strong>Retirada del consentimiento:</strong> en cualquier momento, especialmente para la publicidad personalizada.</li>
        </ul>
        <p>Para ejercer estos derechos: <a href="mailto:awrghise@gmail.com">awrghise@gmail.com</a>. También puede presentar una reclamación ante la CNDP en Marruecos o ante la autoridad de protección de datos de su país de residencia.</p>

        <h2>11. Eliminación de la Cuenta</h2>
        <p>Puede eliminar definitivamente su cuenta y sus datos desde la app: <strong>Configuración → Cuenta → Eliminar cuenta</strong>, o contactándonos en <a href="mailto:awrghise@gmail.com">awrghise@gmail.com</a>. La eliminación borra sus datos apícolas y su perfil, sin perjuicio de las obligaciones legales de conservación y del plazo de purga de copias de seguridad.</p>

        <h2>12. Menores</h2>
        <p>La app no está destinada a menores de 13 años (o menores de 16 en el Espacio Económico Europeo). No recopilamos datos de menores a sabiendas. Si cree que un menor nos ha facilitado datos, contáctenos para eliminarlos.</p>

        <h2>13. Cambios en esta Política</h2>
        <p>Podemos actualizar esta política para reflejar cambios legales o técnicos. La nueva versión se publica en esta página con una nueva fecha de entrada en vigor. En caso de cambios importantes, puede mostrarse un aviso en la app.</p>

        <h2>14. Contacto</h2>
        <p>Para cualquier pregunta, reclamación o solicitud sobre sus datos:<br>Correo: <a href="mailto:awrghise@gmail.com">awrghise@gmail.com</a><br>Responsable: desarrollador de Hivelogbee, Marruecos.</p>

        <h1>Hivelogbee Gizlilik Politikası</h1>
        <p class="effective-date"><strong>Yürürlük tarihi:</strong> 26 Ekim 2026 — Sürüm 1.0</p>

        <h2>1. Veri Sorumlusu</h2>
        <p>Hivelogbee, Fas merkezli bir geliştirici tarafından geliştirilmekte ve yönetilmektedir.<br>Verilerinizle ilgili sorular için: <a href="mailto:awrghise@gmail.com">awrghise@gmail.com</a></p>

        <p>İşleme, Fas yasalarına (kişisel verilerin işlenmesine ilişkin 09-08 sayılı Kanun) tabidir.</p>

          <li><strong>Konum:</strong> yalnızca arılık oluştururken veya düzenlerken hava tahmini için. Arka planda izlenmez ve reklam amacıyla kullanılmaz.</li>
          <li><strong>Bildirimler:</strong> etkinleştirdiğiniz hatırlatıcı ve uyarıları göndermek için bildirim belirteci (FCM), saat dilimi ve dil.</li>

        </ul>

        <h2>4. Amaçlar ve Hukuki Dayanaklar</h2>
        <ul>
          <li><strong>Hizmetin sunulması:</strong> arıcılık verilerinizi saklamak ve eşitlemek (sözleşmenin ifası).</li>
          <li><strong>Yedekleme ve eşitleme:</strong> verilerinizi sunucularımızda tutmak ve başka bir cihazda geri yüklemek (sözleşmenin ifası).</li>
          <li><strong>Bildirimler:</strong> etkinleştirdiğiniz hatırlatıcılar, hava uyarıları ve mesajlar (onay veya sözleşme).</li>
          <li><strong>Reklam:</strong> reklam göstermek (kişiselleştirilmiş reklamlar için onay; yasanın izin verdiği durumlarda kişiselleştirilmemiş reklamlar için meşru menfaat).</li>
          <li><strong>Güvenlik ve iyileştirme:</strong> kötüye kullanımı önlemek ve uygulama kararlılığını artırmak (meşru menfaat).</li>

        <h2>5. Depolama ve Barındırma</h2>
        <p>Verileriniz önce cihazınızda yerel olarak saklanır (çevrimdışı öncelikli), ardından Avrupa Birliği'nde (Fransa) bulunan sunucularda barındırılan Supabase ile eşitlenir. İletişim şifrelenir (TLS) ve erişim, sunucu tarafı güvenlik kurallarıyla hesap sahibiyle sınırlandırılır.</p>

        <h2>6. Alıcılar ve Paylaşım</h2>
        <p>Verileriniz asla satılmaz. Yalnızca açıklanan amaçlarla aşağıdaki sağlayıcılar tarafından işlenebilir:</p>

        <p>Bazı sağlayıcılar verileri Fas veya Avrupa Birliği dışında işleyebilir. Bu aktarımlar, yürürlükteki yasanın öngördüğü uygun güvencelerle korunur.</p>

        <p>Onayınızı istediğiniz zaman şuradan değiştirebilir veya geri çekebilirsiniz: <strong>Ayarlar → Reklam gizliliği ayarları</strong>.</p>

        <h2>8. Saklama Süreleri</h2>

          <li><strong>Yedekler:</strong> silme işleminden sonra teknik yedekler temizlenene kadar en fazla 30 gün.</li>
          <li><strong>Teknik günlükler ve hata raporları:</strong> en fazla 90 gün.</li>
          <li><strong>Reklam verileri:</strong> Google tarafından belirlenen sürelere göre.</li>

        <h2>9. Güvenlik</h2>
        <p>Makul teknik ve idari önlemler uygularız: iletişim şifreleme, erişim kontrolü, hesap bazında veri izolasyonu ve güvenli kimlik doğrulama. Hiçbir sistem tamamen güvenli değildir; lütfen güçlü ve benzersiz bir parola kullanın.</p>

        <h2>10. Haklarınız</h2>
        <p>Yasalarınıza bağlı olarak aşağıdaki haklara sahipsiniz:</p>
        <ul>
          <li><strong>Erişim:</strong> hangi verilerin işlendiğini öğrenme.</li>
          <li><strong>Düzeltme:</strong> yanlış verileri düzeltme.</li>
          <li><strong>Silme:</strong> hesabınızı ve verilerinizi silme.</li>
          <li><strong>Kısıtlama ve itiraz:</strong> belirli işlemeleri kısıtlama veya itiraz etme.</li>

          <li><strong>Onayı geri çekme:</strong> her zaman, özellikle kişiselleştirilmiş reklamlar için.</li>
        </ul>
        <p>Bu hakları kullanmak için: <a href="mailto:awrghise@gmail.com">awrghise@gmail.com</a>. Ayrıca Fas'ta CNDP'ye veya ikamet ettiğiniz ülkedeki veri koruma otoritesine şikâyette bulunabilirsiniz.</p>

        <h2>11. Hesabın Silinmesi</h2>
        <p>Hesabınızı ve verilerinizi uygulamadan kalıcı olarak silebilirsiniz: <strong>Ayarlar → Hesap → Hesabı sil</strong> veya <a href="mailto:awrghise@gmail.com">awrghise@gmail.com</a> adresinden bize ulaşarak. Silme işlemi, yasal saklama yükümlülükleri ve yedek temizleme süresi saklı kalmak kaydıyla arıcılık verilerinizi ve profilinizi siler.</p>

        <h2>12. Çocuklar</h2>
        <p>Uygulama 13 yaşından küçükler (Avrupa Ekonomik Alanı'nda 16 yaşından küçükler) için tasarlanmamıştır. Çocuklara ait verileri bilerek toplamayız. Bir çocuğun bize veri verdiğini düşünüyorsanız, silmemiz için bizimle iletişime geçin.</p>

        <h2>13. Politikadaki Değişiklikler</h2>
        <p>Yasal veya teknik değişiklikleri yansıtmak için bu politikayı güncelleyebiliriz. Yeni sürüm, yeni bir yürürlük tarihiyle bu sayfada yayımlanır. Önemli değişikliklerde uygulama içinde bildirim gösterilebilir.</p>

        <h2>14. İletişim</h2>
        <p>Verilerinizle ilgili her türlü soru, şikâyet veya talep için:<br>E-posta: <a href="mailto:awrghise@gmail.com">awrghise@gmail.com</a><br>Sorumlu: Hivelogbee geliştiricisi, Fas.</p>

    function changeLanguage() {
      const lang = document.getElementById('language-selector').value;
      const container = document.getElementById('content-container');
      const htmlTag = document.getElementById('html-tag');

      container.innerHTML = translations[lang];

      if (lang === 'ar') {
        htmlTag.setAttribute('dir', 'rtl');
        container.classList.add('rtl');
      } else {
        htmlTag.setAttribute('dir', 'ltr');
        container.classList.remove('rtl');
      }
    }

    changeLanguage();
</script>
</body>
</html>
